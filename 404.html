    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-DR6YR5KJC8');
    document.addEventListener('click', function (e) {
      var a = e.target.closest && e.target.closest('a[href]');
      if (!a) return;
      var h = a.getAttribute('href');
      var m = /^mailto:/i.test(h) ? 'email' : /^tel:/i.test(h) ? 'phone' : /bookings\.cloud\.microsoft/i.test(h) ? 'book_a_call' : null;

    });
  </script>
